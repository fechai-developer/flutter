name: fechai
description: "Fechaí — divisão de despesas de grupo e assinaturas compartilhadas, com cobrança via WhatsApp e PIX."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Estado (decidido: Riverpod)
  flutter_riverpod: ^2.6.1

  # Navegação
  go_router: ^14.6.2

  # Backend (decidido: Supabase) — plugado atrás de interfaces de repositório
  supabase_flutter: ^2.8.0

  # Design system / PRD seção 8
  google_fonts: ^6.2.1
  # phosphor_flutter: ^2.1.0  # incompatível com Flutter 3.44 (IconData virou
  # final class). Ver lib/core/icons.dart — reativar quando o pacote atualizar.
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1

  # Relatório da caixinha em PDF (gerar + compartilhar/imprimir)
  pdf: ^3.11.1
  printing: ^5.13.2

  # Utilidades
  characters: ^1.3.0   # iniciais do avatar (grapheme-safe) fora de widgets
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
